name: Build Malawi WPDx registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download verified HDX resource
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "https://data.humdata.org/dataset/4c5e7cd0-3d28-4827-888c-e58e80b2eb47/resource/d0a23110-8be3-43f2-ab31-44a37cb5b804/download/wpdx_enhanced.csv" \
            --output /tmp/wpdx_enhanced.csv
      - name: Inspect source headers and build Malawi slice
        run: python scripts/fetch_wpdx_malawi.py --input /tmp/wpdx_enhanced.csv
      - name: Validate generated files
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path
          csv_path = Path("data/wpdx_malawi.csv")
          manifest_path = Path("data/manifest.json")
          expected = ["row_id", "water_source", "water_tech", "country_code", "lat_deg", "lon_deg", "status_id", "report_date", "install_year"]
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          with csv_path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              assert reader.fieldnames == expected, reader.fieldnames
              rows = list(reader)
          assert manifest["rows"] == len(rows), (manifest["rows"], len(rows))
          assert manifest["sha256"] == hashlib.sha256(csv_path.read_bytes()).hexdigest()
          assert all(row["country_code"] == "MWI" for row in rows)
          print(f"headers={reader.fieldnames}")
          print(f"rows={len(rows)} sha256={manifest['sha256']}")
          print(f"source_columns={manifest['source_columns']}")
          PY
      - name: Run registry tests
        run: python -m pytest -q tests/test_registry.py
      - name: Commit generated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wpdx_malawi.csv data/manifest.json
          if git diff --cached --quiet; then
            echo "Generated files are unchanged."
            exit 0
          fi
          git commit -m "data: refresh Malawi WPDx registry"
          git push origin HEAD:main
